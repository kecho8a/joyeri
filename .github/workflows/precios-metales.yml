name: Actualizar precios de metales (BanRep)

on:
  schedule:
    # 14:00 UTC = 9:00 a. m. hora de Colombia (UTC-5)
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Obtener tasas del Banco de la República
        run: node scripts/fetch-precios-metales.mjs

      - name: Commit solo si cambiaron los precios
        id: diff
        run: |
          if git diff --quiet -- public/precios-metales.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en los precios oficiales."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/precios-metales.json
            git commit -m "chore: actualizar tasas oficiales de metales (BanRep)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar sitio si hubo cambios
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
